let ciSel={};
function checkinSheet(){
  const seg=(k,opts)=>`<div class="seg" role="group" aria-label="${k}">${opts.map(o=>`<button class="${ciSel[k]===o?"on":""}" data-act="ci:${k}:${o}">${L(o)}</button>`).join("")}</div>`;
  sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ci-h" data-stop="1"><div class="grab"></div><h2 id="ci-h">${L("How are you, really?")}</h2>
    <div class="mood">${["Low","Okay","Good"].map((m,i)=>`<button class="${ciSel.mood===m?"on":""}" data-act="ci:mood:${m}">${moodFace(i)}${L(m)}</button>`).join("")}</div>
    <div class="eyebrow">${L("Any cravings?")}</div>${seg("craving",["None","Some","Strong"])}
    ${ciSel.craving&&ciSel.craving!=="None"?`<div class="eyebrow">What set it off? (optional)</div><div class="chips">${TRIG.map(g=>`<button class="chip ${(ciSel.tags||[]).includes(g)?"on":""}" data-act="ci-tag:${g}">${g}</button>`).join("")}</div>
    ${S.trackers.length>1?`<div class="eyebrow">Craving for</div><div class="chips">${S.trackers.map(x=>`<button class="chip ${ciSel.sub===x.sub?"on":""}" data-act="ci-sub:${x.sub}">${esc(SN(x))}</button>`).join("")}</div>`:""}
    ${S.pro?`<div class="eyebrow">How intense? ${PROTAG}</div><div class="seg">${[1,2,3,4,5].map(n=>`<button class="${ciSel.i===n?"on":""}" data-act="ci-int:${n}">${n}</button>`).join("")}</div><div class="row between small muted"><span>Mild</span><span>Intense</span></div>
    <div class="eyebrow">What helped? ${PROTAG}</div><div class="chips">${HELPED.map(h=>`<button class="chip ${(ciSel.helped||[]).includes(h)?"on":""}" data-act="ci-help:${h}">${h}</button>`).join("")}</div>`:
    `<button class="ghost small" style="align-self:flex-start;padding-inline:0" data-act="pro-sheet">${PROTAG} Rate intensity and log what helped</button>`}`:""}
    <button class="primary wide" data-act="ci-save">${L("Done")}</button>
    <button class="ghost" data-act="close-sheet">${L("Not now")}</button></div>`);

function strongSheet(){
  sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-h" data-stop="1"><div class="grab"></div><h2 id="st-h">${L("Strong craving? You noticed it. That counts.")}</h2>
    <p class="muted">${L("Cravings rise and fall like a wave, often within minutes. Pick one:")}</p>${sayBtn()}

    <button class="mintb wide" data-act="go-calm">${L("Pop bubbles or breathe")}</button>
    ${S.clinic.phone?`<a class="btn primary wide" href="tel:${telFull(S.clinic)}">${L("Call my clinic")}</a><p class="small muted">${esc(dispPhone(S.clinic))}</p>`:""}
    ${S.trusted.phone?`<button class="wide" data-act="hello">Message ${esc((S.trusted.name||"my person").replace(/ \(sample\)/,""))}</button>`:""}
    ${escalation()?`<div class="card esc">${escBody(escalation())}</div>`:""}

function freeSheet(quest){
  sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fr-h" data-stop="1"><div class="grab"></div><h2 id="fr-h">${esc(quest.t)}?</h2>
    <p class="muted">Honest answers only. Either way, nothing you've earned is lost.</p>
    <button class="mintb wide" data-act="free-yes:${quest.id}">Yes!</button><button class="wide" data-act="free-no:${quest.tid}">Not today</button></div>`);
}
function safetyFor(sub){
  if(sub==="Alcohol")return `<p><b>If you were drinking heavily</b>, stopping again suddenly can cause dangerous withdrawal. Talk to your doctor before stopping on your own.</p><p><b>Get emergency help now</b> for a seizure, seeing or hearing things, confusion, severe shaking, or a racing heart with fever.</p>`;
  if(sub==="Tobacco")return `<p>A tobacco slip isn't dangerous in itself. Cravings usually pass within minutes. If you use nicotine replacement, keep using it as your clinician advised.</p>`;
  return `<p>If you feel very unwell, confused, have chest pain or trouble breathing, or someone can't be woken, call emergency services now.</p><p>Avoid mixing substances, and don't use alone.</p>`;
}
let slipSel=null;
function openSlip(id){slipSel=id||(S.trackers[0]&&S.trackers[0].id)||null;drawSlip()}
function drawSlip(){
  const t=S.trackers.find(x=>x.id===slipSel),c=S.clinic;
  sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="slip-h" data-stop="1"><div class="grab"></div>
    <h1 id="slip-h">${L("You haven't lost your progress.")}</h1><p class="muted">${L("Your steps, seeds and stickers all stay. Let's focus on what you need now.")}</p>${sayBtn()}
    ${escalation()?`<div class="card esc">${escBody(escalation())}</div>`:""}
    ${S.trackers.length>1?`<div class="chips">${S.trackers.map(x=>`<button class="chip ${x.id===slipSel?"on":""}" data-act="slip-sel:${x.id}">${esc(SN(x))}</button>`).join("")}</div>`:""}
    <div class="card" style="background:var(--lilac);color:var(--candy-ink)"><div class="eyebrow" style="color:inherit">${L("Stay safe")}${t?" · "+esc(SN(t)):""}</div>${safetyFor(t&&t.sub)}
      ${t&&t.sub==="Alcohol"?`<button class="chip ${S.heavy===today()?"on":""}" style="align-self:flex-start" data-act="heavy">I've been drinking heavily for days</button>`:""}</div>
    ${plansInline()}<div class="card"><div class="eyebrow">${L("Reach help")}</div>
      ${c.phone?`<div class="row between"><span>${esc(c.name||"My clinic")}<br><span class="copyable">${esc(dispPhone(c))}</span></span><a class="btn primary" href="tel:${telFull(c)}">Call</a></div>`:`<p class="small muted">No clinic saved yet. Add it in Care.</p>`}
      <div class="hr"></div>${emergRow()}
      ${S.people.map(x=>`<div class="hr"></div><div class="row between"><span>${esc(x.name)}<br><span class="small muted">${esc(x.rel||"Trusted person")}</span></span><button data-act="hello-k:call">Message</button></div>`).join("")}
      <div class="row"><button class="grow" data-act="sp-open">My safety plan</button><button class="grow sun" data-act="wave-start">10-minute timer</button></div>
      <p class="small muted">If calling doesn't start from this page, dial the number shown.</p></div>
    ${t&&t.goal==="quit"?`<div class="card" style="background:var(--mint);color:var(--candy-ink)"><div class="eyebrow" style="color:inherit">When you're ready</div>
      <p>Only your ${esc(DISC()?SN(t):t.sub.toLowerCase())} day count starts again${S.trackers.length>1?". Your other trackers are untouched":""}. Your journey map never goes backwards, and coming back earns the "Came back" sticker.</p>
      <button class="primary wide" data-act="slip-restart:${t.id}">Start my ${esc(DISC()?SN(t):t.sub.toLowerCase())} count again</button></div>`:
      t?`<div class="note">Logging use is part of your cut-down plan. Nothing resets.</div>`:""}
    <button class="ghost" data-act="close-sheet">${L("Close")}</button></div>`);
}

    const ss=window.speechSynthesis;if(ss.speaking){ss.cancel();toast(L("Stopped"));return}

var unlocked=!(S.lock&&S.lock.pin),pinIn="",hiddenAt=0,pinMode="unlock",pinFirst="",hidden=false;
const AUTO=[[0,"At once"],[30,"30 sec"],[60,"1 min"],[300,"5 min"]];
const WORDS=["mango","river","kite","lamp","tiger","cloud","pepper","drum","lotus","comet","maple","pearl","rocket","tulip","violin","banyan","coral","ember","falcon","ginger","harbor","island","jasmine","lantern","marble","nectar","orbit","paddy","quartz","saffron","temple","walnut"];
function recCode(){const a=new Uint32Array(6);crypto.getRandomValues(a);return [...a].map(x=>WORDS[x%WORDS.length]).join(" ")}
const FINGER='<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 11v3a8 8 0 0 0 1.5 4.7"/><path d="M8.5 9.5A4 4 0 0 1 16 11v2.5a11 11 0 0 0 .8 4"/><path d="M5.5 8a7.5 7.5 0 0 1 13 3v2"/><path d="M8.6 14a12 12 0 0 0 1.6 5.6"/></svg>';
const EYE='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20L20 4"/></svg>';
const PINT={unlock:["Enter your PIN",""],new:["Choose a 4-digit PIN","Avoid your birthday or 1234."],confirm:["Enter it again","Just to be sure."],old:["Enter your current PIN",""],off:["Enter your PIN to turn the lock off",""],rec:["Enter your PIN to see your recovery words",""]};
function pad(){const keys=["1","2","3","4","5","6","7","8","9","bio","0","del"];
  return `<div class="pindots" id="pindots" aria-label="${pinIn.length} of 4 digits entered">${[0,1,2,3].map(i=>`<i class="${pinIn.length>i?"on":""}"></i>`).join("")}</div>
  <div class="keypad">${keys.map(k=>k==="bio"?(pinMode==="unlock"?`<button data-act="pin-bio" aria-label="Use fingerprint">${FINGER}</button>`:"<span></span>"):k==="del"?`<button data-act="pin-del" aria-label="Delete">⌫</button>`:`<button class="num" data-act="pin:${k}">${k}</button>`).join("")}</div>`}
function vLock(){pinMode="unlock";
  return `<div class="ob lockscreen"><div style="display:flex;justify-content:center;margin-top:24px">${DISC()?`<div class="plainlogo" aria-hidden="true">${CHECK}</div>`:LOGO}</div>

}
function pinSheet(mode){if(mode){pinMode=mode;pinIn="";pinFirst=mode==="new"?"":pinFirst}
  sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pn-h" data-stop="1"><div class="grab"></div><h2 id="pn-h" style="text-align:center">${PINT[pinMode][0]}</h2>${PINT[pinMode][1]?`<p class="small muted" style="text-align:center">${PINT[pinMode][1]}</p>`:""}${pad()}<button class="ghost" data-act="close-sheet">Cancel</button></div>`);
}
function pinRedraw(){if(pinMode==="unlock")render();else pinSheet()}
function pinFail(msg){pinIn="";buzz([30,40,30]);pinRedraw();const d=document.getElementById("pindots");if(d)d.classList.add("shake");toast(msg)}
function pinKey(k){
  if(pinIn.length>=4)return;pinIn+=k;buzz(8);sfx("tick");pinRedraw();if(pinIn.length<4)return;
  setTimeout(()=>{const v=pinIn;pinIn="";
    if(pinMode==="unlock"){if(v===S.lock.pin){unlocked=true;pinIn="";buzz(20);render();dailyOpen()}else pinFail("That PIN didn't match");return}
    if(pinMode==="old"){if(v===S.lock.pin)pinSheet("new");else pinFail("That's not your current PIN");return}
    if(pinMode==="new"){if(/^(\d)\1{3}$/.test(v)||v==="1234"){pinFail("Too easy to guess. Try another");return}pinFirst=v;pinSheet("confirm");return}
    if(pinMode==="confirm"){if(v!==pinFirst){pinMode="new";pinFail("They didn't match. Start again");return}
      const first=!S.lock.rec;S.lock.pin=v;unlocked=true;if(first)S.lock.rec=recCode();save();render();if(first)recSheet(true);else{closeSheet();toast("PIN changed")}return}
    if(pinMode==="off"){if(v===S.lock.pin){S.lock.pin="";S.lock.bio="";save();closeSheet();render();toast("PIN lock off")}else pinFail("That PIN didn't match");return}
    if(pinMode==="rec"){if(v===S.lock.pin)recSheet(false);else pinFail("That PIN didn't match");return}
  },180);
}
function recSheet(isNew){
  sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rc-h" data-stop="1"><div class="grab"></div><h2 id="rc-h">${isNew?"PIN lock is on. Save your recovery words":"Your recovery words"}</h2>

function forgotSheet(){

const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function bioNA(){sheet(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bn-h" data-stop="1"><div class="grab"></div><div style="display:flex;justify-content:center;color:var(--pri)">${FINGER.replace(/width="24" height="24"/,'width="64" height="64"')}</div><h2 id="bn-h">Fingerprint isn't available on this page</h2>
  <p class="muted">This browser or preview doesn't let web pages use fingerprint or face unlock. In the app-store version it uses your phone's own fingerprint or face. Your PIN keeps working meanwhile.</p><button class="primary wide" data-act="close-sheet">Okay</button></div>`)}
async function bioRegister(){
  if(!S.lock.pin){toast("Set a PIN first");return}
  if(!window.PublicKeyCredential||!navigator.credentials||!navigator.credentials.create){bioNA();return}
  try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Unhookd"},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"unhookd",displayName:"Unhookd"},
    pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});
    S.lock.bio=b64(c.rawId);save();render();toast("Fingerprint unlock on")}catch(e){bioNA()}
}
async function bioUnlock(){
  if(!S.lock.bio){toast("Turn on fingerprint in Me › Privacy first");return}
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:ub64(S.lock.bio)}],userVerification:"required",timeout:60000}});
    unlocked=true;pinIn="";render();dailyOpen()}catch(e){toast("Fingerprint didn't work. Use your PIN")}
}
document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenAt=Date.now()}else if(S.lock.pin&&unlocked&&hiddenAt&&Date.now()-hiddenAt>=(S.lock.auto||0)*1000){unlocked=false;pinIn="";closeSheet();render()}});

/* ---------- if-then plans ---------- */
const TAGIF={Stress:"I'm stressed",Boredom:"I'm bored with nothing to do","Low mood":"I'm feeling low",Tiredness:"I'm exhausted",People:"I'm with people who are using",Place:"I'm somewhere I used to use",Celebration:"there's a party or celebration",Pain:"I'm in pain",Evening:"it's evening and the urge kicks in",Payday:"I've just been paid",Weekend:"it's the weekend","After a fight":"I've had a fight with someone"};
const ACTS={wave:["ride the wave with a 10-minute timer","Ride the wave (10-min timer)"],calm:["go to the calm corner and breathe","Calm corner"],walk:["walk for 10 minutes","Walk for 10 minutes"],hello:["message one of my people","Message my people"],
  water:["drink water and eat something","Water and a snack"],leave:["leave the place for a while","Leave the place"],shower:["take a cold shower","Cold shower"],call:["call my clinic","Call my clinic"],custom:["","Something else"]};
function planTxt(p){return `<b>${L("If")}</b> ${esc(p.if)}, <b>${L("then")}</b> ${esc(p.then)}.`}
function planBuilder(){
  const b=ui.pb;const step=`<div class="pbsteps">${[1,2,3].map(i=>`<i class="${b.step>=i?"on":""}"></i>`).join("")}</div>`;
  if(b.step===1)return `<div class="pb">${step}<div class="eyebrow">Step 1 of 3 · When is it risky?</div><div class="chips">${Object.keys(TAGIF).map(t=>`<button class="chip ${b.tag===t?"on":""}" data-act="pb-tag:${t}">${t}</button>`).join("")}</div>
    <label>If…<input id="pb-if" maxlength="80" value="${esc(b.ifText||"")}" placeholder="I'm stressed after work"></label><div class="row"><button class="primary" data-act="pb-next">Next</button><button data-act="pb-cancel">Cancel</button></div></div>`;
  if(b.step===2)return `<div class="pb">${step}<div class="eyebrow">Step 2 of 3 · What will you do instead?</div><div class="chips">${Object.entries(ACTS).map(([k,v])=>`<button class="chip ${b.act===k?"on":""}" data-act="pb-act:${k}">${v[1]}</button>`).join("")}</div>
    <label>then I will…<input id="pb-then" maxlength="80" value="${esc(b.thenText||"")}" placeholder="walk round the block before going home"></label><div class="row"><button class="primary" data-act="pb-next">Next</button><button data-act="pb-back">Back</button></div></div>`;
  return `<div class="pb">${step}<div class="eyebrow">Step 3 of 3 · Your plan</div><p class="planbig">${planTxt({if:b.ifText,then:b.thenText})}</p><p class="small muted">Say it out loud once. Plans you've rehearsed are easier to follow when a craving hits.</p>
    <div class="row"><button class="primary" data-act="pb-save">Save plan</button><button data-act="say">${SPK} Say it</button><button data-act="pb-back">Back</button></div></div>`;
}
function plansBlock(){
  const best=[...S.plans].sort((a,b)=>(b.helped-a.helped)||(b.used-a.used));
  return `<div class="card" id="plans"><div class="row between"><h2>My if-then plans</h2>${ui.pb?"":`<button class="ghost small" data-act="add-plan">Add</button>`}</div>

function plansInline(match){

  const list=(match&&match.length?match:[...S.plans].sort((a,b)=>b.helped-a.helped)).slice(0,2);
  return `<div class="card" style="background:var(--sun-soft,var(--chip))"><div class="eyebrow">${L("Your plan")}${match&&match.length?" · "+esc(match[0].tag):""}</div>${list.map(p=>`<p>${planTxt(p)}</p><button class="mintb small" style="align-self:flex-start" data-act="plan-do:${p.id}">Do it now</button>`).join("")}</div>`;

function doPlan(p){
  p.used++;S.planFollow={id:p.id,d:today(),t:Date.now()};save();closeSheet();
  const a=p.act;if(a==="wave"||a==="walk"){waveSheet(a==="walk"?"Walk for 10 minutes":"Ride the wave");return}
  if(a==="calm"){go("calm");return}if(a==="hello"){helloSheet("call");return}
  if(a==="call"&&S.clinic.phone){callSheet(dispPhone(S.clinic),S.clinic.name||"My clinic");return}

function signals(){
  const T=S.triggers||[],strong7=T.filter(x=>x.d>=addDays(-6)&&x.c==="Strong").length,slips14=S.slips.filter(x=>x.date>=addDays(-13)).length;
  const low3=[0,1,2].every(i=>{const c=S.checkins[addDays(-i)];return c&&c.mood==="Low"}),ap=apptInfo(),missed=ap&&ap.past&&!ap.arrived;
  const quiet=S.showups.length>3&&[1,2,3].every(i=>!S.checkins[addDays(-i)]),heavy=S.heavy&&S.heavy>=addDays(-2),wd=S.wd&&S.wd.d>=addDays(-1)?S.wd:null;
  const R=[];
  if(wd&&wd.red)R.push({lvl:"emerg",k:"wd",msg:"You ticked a warning sign of severe withdrawal. Get emergency help now."});
  if(heavy)R.push({lvl:"red",k:"heavy",msg:"You said you've been drinking heavily. Stopping suddenly after that can be risky, so please call your clinic today before you stop on your own."});
  if(wd&&!wd.red&&wd.score>=3)R.push({lvl:"red",k:"wdmod",msg:`Your withdrawal check showed ${wd.score} symptoms. Please call your clinic today.`});
  if(slips14>=2)R.push({lvl:"red",k:"slips",msg:`That's ${slips14} slips in two weeks. Nothing is lost, and this is a good moment to let your clinic help with the plan.`});
  if(strong7>=3)R.push({lvl:"red",k:"strong",msg:`You've logged ${strong7} strong cravings this week. That's a lot to carry alone, and your clinic can help.`});
  if(strong7===2)R.push({lvl:"amber",k:"strong2",msg:"2 strong cravings this week."});
  if(low3)R.push({lvl:"amber",k:"low",msg:"You've felt low three days running."});
  if(missed)R.push({lvl:"amber",k:"missed",msg:"Your last appointment was missed."});
  if(quiet)R.push({lvl:"amber",k:"quiet",msg:"No check-ins for 3 days."});
  if(wd&&!wd.red&&wd.score>0&&wd.score<3)R.push({lvl:"amber",k:"wdmild",msg:"Mild withdrawal symptoms today."});
  return R;
}

const HI=Object.assign({},typeof HI_DATA!=="undefined"?HI_DATA:{});
const HIRX=typeof HIRX_DATA!=="undefined"?HIRX_DATA:[];

function trStr(s){const k=s.trim();if(!k)return s;let r=HI[k];if(!r){for(const [re,f] of HIRX){const m=k.match(re);if(m){r=f(m);break}}}return r?s.replace(k,r):s}
function trDom(root){if(S.lang!=="hi"||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;const v=trStr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
  root.querySelectorAll("[placeholder],[aria-label]").forEach(e=>["placeholder","aria-label"].forEach(a=>{const v=e.getAttribute(a);if(v){const t=trStr(v);if(t!==v)e.setAttribute(a,t)}}))}

  if(!quiet){const r=REW[id];setTimeout(()=>{if(r){toast("New "+(r[0]==="move"?"move":"party effect")+" unlocked: "+r[2]+"  +10 seeds");finnParty(r[0]==="move"?{move:r[1],fx:"",text:r[2]+"!",big:true,force:true}:{fx:r[1],text:r[2]+"!",big:true,force:true})}else toast("New reward  +10 seeds");sfx("coin")},700)}return true};
function moveCard(sid){const r=REW[sid],on=!!S.stickers[sid],fav=S.fav[r[0]]===r[1];
  return `<button class="mvcard ${on?"":"off"} ${fav&&S.party==="fav"?"fav":""}" data-act="${on?"mv-play:"+sid:"mv-locked:"+sid}" aria-label="${esc(r[2])}${on?"":", locked"}">
    <span class="mvart">${r[0]==="move"?`<span class="mini ${on?"mv-"+r[1]+" loop":""}">${buddy(on?3:1,on?S.equip.acc:"none")}</span>`:`<svg viewBox="0 0 24 24" class="fxicon" style="fill:${(PCOL[r[1]]||["#ccc"])[0]};stroke:${(PCOL[r[1]]||["#ccc"])[0]}">${PART[r[1]]}</svg>`}</span>
    <b>${on?esc(r[2]):"Locked"}</b><span class="small muted">${on?(fav&&S.party==="fav"?"Favourite":"Tap to play"):esc(UNLOCK_HINT[sid])}</span></button>`}
function movesBlock(){
  const ids=Object.keys(REW),mv=ids.filter(i=>REW[i][0]==="move"),fx=ids.filter(i=>REW[i][0]==="fx"),got=ids.filter(i=>S.stickers[i]).length;
  return `<div class="row between"><h2>Finn's dance moves</h2><span class="small muted num" style="font-weight:800">${mv.filter(i=>S.stickers[i]).length} of ${mv.length}</span></div>
  <p class="small muted">Finn dances every time you finish a quest. Milestones teach him new moves and party effects.</p>
  <div class="seg">${[["random","Surprise me"],["fav","My favourites"],["off","Off"]].map(([k,l])=>`<button class="${S.party===k?"on":""}" data-act="party-mode:${k}">${l}</button>`).join("")}</div>
  <div class="mvgrid">${mv.map(moveCard).join("")}</div>
  <div class="row between"><h2>Party effects</h2><span class="small muted num" style="font-weight:800">${fx.filter(i=>S.stickers[i]).length} of ${fx.length}</span></div>
  <div class="mvgrid">${fx.map(moveCard).join("")}</div>`;
}

  return `<svg viewBox="0 0 220 110" class="howsvg"><rect x="70" y="8" width="80" height="96" rx="16" fill="var(--pri-soft)" stroke="var(--pri)" stroke-width="4"/><rect x="76" y="62" width="68" height="24" rx="12" fill="var(--pri)"/><text x="110" y="78" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" font-family="Nunito,sans-serif">Get support</text><path d="M96 30h28M96 42h20" stroke="var(--pri)" stroke-width="5" stroke-linecap="round"/><circle cx="178" cy="34" r="14" fill="#B6E84C"/><path d="M172 34l4 4 8-8" stroke="#1A1530" stroke-width="3" fill="none"/></svg>`;
}
const OBN=6;
vOnboard=function(){

  if(st===1)return `<div class="ob"><div class="brandrow">${LOGO}<div><div class="wm">Unhookd</div><div class="small muted" style="font-weight:700">Recovery that fits an ADHD brain</div></div></div>
    <div class="hero obhero"><span class="mini mv-wiggle loop">${buddy(3,"party")}</span><div class="obsay">Hi! I'm Finn. I'll cheer every small win with you.</div></div>

  if(st===3)return `<div class="ob">${top}<h1>Make Finn yours</h1>
    <div class="hero"><span class="mini mv-${ob.dance||"wiggle"} loop">${buddy(3,ob.acc||"none")}</span></div>

    <div class="eyebrow">Pick a starter accessory</div><div class="chips">${["none","party","shades","bow"].map(k=>`<button class="chip ${(ob.acc||"none")===k?"on":""}" data-act="ob-acc:${k}">${ACCS[k].name}</button>`).join("")}</div>
    <button class="primary wide" data-act="ob-next">Looks great</button></div>`;
  if(st===4)return `<div class="ob">${top}<h1>What are you working on?</h1><p class="muted">Pick one or more. Each gets its own tracker. Agree your goal with your clinician.</p>
    <div class="form">${SUBS.map(s=>{const p=ob.picks[s];return `<div class="card" style="padding:12px"><div class="row between"><button class="chip ${p?"on":""}" data-act="ob-pick:${s}">${s}</button>
      ${p?`<div class="seg" style="flex:1;min-width:180px"><button class="${p==="quit"?"on":""}" data-act="ob-goal:${s}:quit">Stop</button><button class="${p==="reduce"?"on":""}" data-act="ob-goal:${s}:reduce">Cut down</button></div>`:""}</div></div>`}).join("")}</div>
    <button class="primary wide" data-act="ob-next">Continue</button></div>`;
  if(st===5)return `<div class="ob">${top}<h1>What gets in the way most?</h1><p class="muted">Pick up to two. Finn will add a tiny daily quest for each.</p>
    <div class="hgrid">${Object.entries(HURDLES).map(([k,v])=>`<button class="${(ob.hurdles||[]).includes(k)?"on":""}" data-act="ob-hurdle:${k}"><b>${v[0]}</b><span class="small">${v[1]}</span></button>`).join("")}</div>
    <button class="primary wide" data-act="ob-next">${(ob.hurdles||[]).length?"Continue":"Skip for now"}</button></div>`;
  return `<div class="ob">${top}<h1>Your safety net</h1><p class="muted">All optional. You can add or change these later.</p>
    <form class="form" data-form="ob">
    <div class="card"><div class="eyebrow">My clinic</div>${ob.clinic?`<div class="note">Clinic code added: <b>${esc(ob.clinic.name||"your clinic")}</b>${ob.appt?" · next visit saved":""}${(ob.meds||[]).length?" · "+ob.meds.length+" medicine times":""}</div>`:`<button type="button" class="sun" style="align-self:flex-start" data-act="code-sheet">I have a clinic code</button>
      <div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Or add the clinic phone</span>${phoneField("o-cc","o-phone","India|91","")}</div>`}</div>
    <div class="card"><div class="eyebrow">One trusted person</div><label>Their name<input name="pname" id="o-pname" placeholder="e.g. a friend or family member"></label>
      <div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Their phone</span>${phoneField("o-pcc","o-pphone","India|91","").replace(/name="cc"/,'name="pcc"').replace(/name="phone"/,'name="pphone"')}</div>
      <p class="small muted">They'll never get anything unless you send it yourself.</p></div>
    <label class="consent" id="o-consent-l"><input type="checkbox" id="o-consent" name="consent"> <span>I understand Unhookd is a support tool, not treatment or emergency care. My data stays on this phone, and I can delete it any time in Me.</span></label>
    <button class="primary wide" type="submit">Finish</button></form></div>`;
};
finishOnboard=function(v){
  v=v||{};const keep={sound:S.sound,haptic:S.haptic};S=blank();Object.assign(S,keep);S.onboarded=true;S.name=(ob.name||"").trim();S.hurdles=ob.hurdles||[];
  Object.entries(ob.picks).forEach(([sub,goal],i)=>S.trackers.push({id:"t"+Date.now()+i,sub,goal,start:today(),limit:goal==="reduce"?(sub==="Tobacco"?5:2):0,log:{}}));
  S.clinic.cc=v.cc||"India|91";S.clinic.phone=(v.phone||"").trim();if(ob.clinic)Object.assign(S.clinic,ob.clinic);if(ob.appt)S.appt={when:ob.appt,arrived:false};
  (ob.meds||[]).forEach((m,i)=>S.meds.push({id:"m"+Date.now()+i,name:m.name,time:m.time,log:{}}));
  if((v.pphone||"").trim())S.people.push({id:"u"+Date.now(),name:(v.pname||"").trim()||"My person",rel:"",cc:v.pcc||"India|91",phone:v.pphone.trim(),via:"wa"});
  S.hurdles.forEach((h,i)=>S.daily.push({id:"d"+Date.now()+i,t:HURDLES[h][1]}));
  const th=ob.theme||"grape",ac=ob.acc||"none";S.owned[th]=true;S.equip.theme=th;S.owned[ac]=true;S.equip.acc=ac;
  S.consent=today();sticker("first",true);ob={step:1,picks:{}};tab="today";save();render();dailyOpen(true);
};

function aboutCard(){return `<div class="card" id="about"><h2>About me</h2><form class="form" data-form="about"><label>What Finn calls you<input name="name" id="f-myname" maxlength="24" value="${esc(S.name)}" placeholder="Your first name or a nickname"></label>

  "party-mode":p=>{S.party=p;save();render();if(p!=="off")finnParty({force:true,text:p==="fav"?"My favourites!":"Surprise!"});else toast("Celebrations off")},
  "mv-play":p=>{const r=REW[p];if(!r)return;S.fav[r[0]]=r[1];if(S.party==="random"){}save();finnParty(r[0]==="move"?{move:r[1],fx:"",text:r[2]+"!",force:true,big:true}:{fx:r[1],text:r[2]+"!",force:true,big:true});
    render();toast(S.party==="fav"?r[2]+" is now your favourite":"Set “My favourites” to always use "+r[2])},
  "mv-locked":p=>{toast("Unlock: "+UNLOCK_HINT[p]);buzz([10,40,10])},

/* ---------- actions ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  if(el.classList.contains("scrim")&&e.target.closest("[data-stop]"))return;
  const parts=el.dataset.act.split(":"),a=parts[0],p=parts[1],q=parts[2];
  const tr=id=>S.trackers.find(t=>t.id===id);
  if(FX[a]){FX[a](p,q,el,e);return}
  switch(a){
    case "tab":buzz(8);go(p);return;
    case "pro-toggle":S.pro=!S.pro;save();render();if(S.pro){rain();sfx("win");buzz([30,40,30]);toast("Pro unlocked for this prototype")}return;
    case "pro-on":S.pro=true;save();closeSheet();render();rain();sfx("win");buzz([30,40,30]);toast("Pro unlocked for this prototype");return;
    case "pro-sheet":proSheet();buzz(8);return;
    case "diff":S.difficulty=p;buzz(8);sfx("tick");save();render();return;
    case "ci-int":ciSel.i=+p;buzz(8);checkinSheet();return;
    case "ci-help":{const g=ciSel.helped||(ciSel.helped=[]);const k=g.indexOf(p);if(k>=0)g.splice(k,1);else g.push(p);buzz(8);checkinSheet();return}
    case "copy-report":{const txt=reportText();try{navigator.clipboard.writeText(txt).then(()=>toast("Report copied"),()=>toast("Select the text to copy"))}catch(err){toast("Select the text to copy")}return}
    case "ripple":{const r=el.getBoundingClientRect(),x=(e.clientX||r.left+r.width/2)-r.left,y=(e.clientY||r.top+r.height/2)-r.top;const s=document.createElement("span");s.className="ripple";s.style.left=x+"px";s.style.top=y+"px";el.appendChild(s);setTimeout(()=>s.remove(),1600);
      buzz(12);sfx("tick");ripples++;const n=document.getElementById("rip-n");if(n)n.textContent=ripples;if(ripples>=20){ripples=0;setTimeout(()=>finishCalm(el),400)}return}
    case "allq":ui.allQ=!ui.allQ;buzz(8);render();return;
    case "deld":S.daily=S.daily.filter(c=>c.id!==p);save();render();return;
    case "own-start":go("me");ui.confirmReset=true;render();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50);return;
    case "doc":doctorSheet();buzz(8);return;
    case "pace":if(breath.on)stopBreath();S.pace=p==="short"?"short":"long";save();render();return;
    case "ground":ground=ground>=GROUND.length-1?0:ground+1;buzz(10);sfx("tick");render();return;
    case "mode":S.mode=isDark()?"light":"dark";buzz(10);sfx("tick");save();render();return;
    case "mode-set":S.mode=p==="dark"?"dark":"light";save();render();return;
    case "go-rewards":go("journey");setTimeout(()=>{const r=document.getElementById("rewards");if(r)r.scrollIntoView({behavior:reduced()?"auto":"smooth"})},60);return;
    case "go-learn":go("learn");return;
    case "go-journey":case "see-map":go("journey");return;
    case "story":openStory(p);return;
    case "st-next":storyNext();return;
    case "st-prev":if(story&&story.i>0){story.i--;drawStory()}return;
    case "st-close":story=null;closeSheet();return;
    case "st-ans":storyAnswer(p,el);return;
    case "st-done":storyNext();return;
    case "go-care":go("care");return;
    case "go-calm":go("calm");return;
    case "ob-next":if(ob.step===2&&!Object.keys(ob.picks).length){toast("Pick at least one to continue");buzz([10,40,10]);return}buzz(10);ob.step++;render();return;
    case "ob-pick":if(ob.picks[p])delete ob.picks[p];else ob.picks[p]=(p==="Tobacco"?"reduce":"quit");buzz(10);sfx("tick");render();return;
    case "ob-goal":ob.picks[p]=q;render();return;
    case "ob-finish":{const k=document.getElementById("o-consent");if(k&&!k.checked){needConsent();return}const s=document.getElementById("o-cc");finishOnboard("","",s?s.value:"");return}
    case "load-sample":{const keep={sound:S.sound,haptic:S.haptic};S=sample();Object.assign(S,keep);ui.confirmReset=false;tab="today";save();render();dailyOpen();return}
    case "reset-ask":ui.confirmReset=true;render();return;
    case "reset-no":ui.confirmReset=false;render();return;
    case "reset-yes":S=blank();ui.confirmReset=false;save();closeSheet();render();return;
    case "close-sheet":closeSheet();return;
    case "welcome-go":{const b=el.getBoundingClientRect();closeSheet();burst(b.left+b.width/2,b.top,40,10);buzz(25);sfx("coin");return}
    case "q":{
      const quest=quests().find(x=>x.id===p);if(!quest)return;const id=quest.id;
      if(qd()[id]){undoQuest(id);if(id.startsWith("med-")){const m=S.meds.find(x=>"med-"+x.id===id);if(m)delete m.log[today()]}buzz(8);save();render();return}
      if(quest.act==="checkin"){ciSel={};checkinSheet();return}
      if(quest.act==="hello"){helloSheet();return}
      if(quest.act==="rehearse"){rehearseSheet();return}
      if(quest.act==="go-plans"){FX["go-plans"]();return}
      if(quest.act==="go-care"){go("care");return}
      if(quest.act==="go-calm"){go("calm");return}
      if(quest.act==="go-learn"){go("learn");return}
      if(quest.act==="arrive"){doArrive(el);return}
      if(quest.act==="free"){if(new Date().getHours()<17){toast("Tick this in the evening, once the day's nearly done");buzz([10,40,10]);return}freeSheet(quest);return}
      if(id.startsWith("med-")){const m=S.meds.find(x=>"med-"+x.id===id);if(m)m.log[today()]="taken"}
      completeQuest(id,el);save();render();bumpBuddy();return}
    case "free-yes":{closeSheet();completeQuest(p,document.querySelector(`[data-act="q:${p}"]`));save();render();bumpBuddy();return}
    case "free-no":openSlip(p);return;
    case "delq":S.custom[today()]=(S.custom[today()]||[]).filter(c=>c.id!==p);save();render();return;
    case "slip":openSlip(p);return;
    case "slip-sel":slipSel=p;drawSlip();return;
    case "slip-restart":{const t=tr(p);const st=steps();t.start=today();S.slips.push({id:p,date:today(),step:st});sticker("back");save();render();relapseSheet();return}
    case "inc":{const t=tr(p);t.log[today()]=(t.log[today()]||0)+1;buzz(12);sfx("tick");save();render();return}
    case "dec":{const t=tr(p);t.log[today()]=Math.max(0,(t.log[today()]||0)-1);buzz(8);save();render();return}
    case "ci":ciSel[p]=q;buzz(10);sfx("tick");checkinSheet();return;
    case "ci-tag":{const g=ciSel.tags||(ciSel.tags=[]);const i=g.indexOf(p);if(i>=0)g.splice(i,1);else g.push(p);buzz(8);checkinSheet();return}
    case "ci-sub":ciSel.sub=p;buzz(8);checkinSheet();return;
    case "setup":setupSheet(p);return;
    case "health":healthSheet(p);buzz(8);return;
    case "ci-save":if(!ciSel.mood||!ciSel.craving){toast(!ciSel.mood?"Pick how you feel first":"Pick a craving level first");buzz([10,40,10]);return}{if(ciSel.craving&&ciSel.craving!=="None")S.triggers.push({d:today(),h:new Date().getHours(),c:ciSel.craving,tags:ciSel.tags||[],sub:ciSel.sub||(S.trackers.length===1?S.trackers[0].sub:""),i:ciSel.i||0,helped:ciSel.helped||[]});S.checkins[today()]={mood:ciSel.mood,craving:ciSel.craving};const strong=ciSel.craving==="Strong";closeSheet();
      sticker("checkin");completeQuest("checkin",document.querySelector('[data-act="q:checkin"]'));save();render();bumpBuddy();setTimeout(()=>afterCheckin(strong),800);return}
    case "arrive":doArrive(el);return;
    case "edit-clinic":ui.editClinic=true;render();return;
    case "cancel-clinic":ui.editClinic=false;render();return;
    case "edit-appt":ui.editAppt=true;render();return;
    case "cancel-appt":ui.editAppt=false;render();return;
    case "add-med":ui.addMed=!ui.addMed;render();return;
    case "med-del":S.meds=S.meds.filter(x=>x.id!==p);save();render();return;
    case "add-tracker":ui.addTracker=!ui.addTracker;render();return;
    case "del-tracker":S.trackers=S.trackers.filter(x=>x.id!==p);save();render();return;
    case "set":S[p]=q==="1";if(p==="haptic"&&S.haptic)buzz(30);if(p==="sound"&&S.sound)sfx("pop");save();render();return;
    case "copy":{const txt=dispPhone(S.clinic);try{navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>toast("Select the number to copy"))}catch(err){toast("Select the number to copy")}return}
    case "acc":case "theme":{
      const cat=a==="acc"?ACCS:THEMES,item=cat[p];if(!item)return;
      if(!S.owned[p]){if(S.seeds<item.price){toast("You need "+(item.price-S.seeds)+" more seeds. Quests earn them");buzz([10,40,10]);return}S.seeds-=item.price;S.owned[p]=true;S.equip[a]=p;save();render();
        const btn=document.querySelector(`[data-act="${a}:${p}"]`);celebrate(btn,"Unlocked!");sfx("coin");return}
      buzz(10);sfx("tick");S.equip[a]=p;save();render();return}
    case "bub":{const i=+p;if(!bubbles[i])return;el.classList.add("popped");buzz(18);sfx("pop");S.stats.pops++;
      const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,8,4);bubbles[i]=null;
      const left=bubbles.filter(Boolean).length,lb=document.getElementById("bub-left");if(lb)lb.textContent=left+" left";
      if(S.stats.pops>=100)sticker("popper");
      if(!left)setTimeout(()=>{bubbles=newBubbles();finishCalm(document.querySelector(".bubbles"))},350);else save();return}
    case "breath":if(breath.on){stopBreath();render()}else{breath.on=true;breath.t=0;render();breathTick();breath.timer=setInterval(breathTick,1000)}return;
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f).entries());
  if(FXS[f.dataset.form]){FXS[f.dataset.form](v,f);return}
  switch(f.dataset.form){
    case "ob":if(!v.consent){needConsent();return}finishOnboard((v.phone||"").trim(),(v.booking||"").trim(),v.cc);return;
    case "addq":{const t=(v.t||"").trim();if(!t)return;if(v.daily)S.daily.push({id:"d"+Date.now(),t});else (S.custom[today()]||(S.custom[today()]=[])).push({id:"c"+Date.now(),t});buzz(12);sfx("tick");save();render();return}
    case "clinic":S.clinic={name:v.name.trim(),doctor:v.doctor.trim(),cc:v.cc||"India|91",phone:v.phone.trim(),booking:v.booking.trim(),address:v.address.trim(),hours:S.clinic.hours||""};ui.editClinic=false;save();render();toast("Clinic saved");return;
    case "appt":{const btn=f.querySelector("button[type=submit]");const r=btn.getBoundingClientRect();
      S.appt={when:v.when,arrived:false};ui.editAppt=false;sticker("booked");
      if(!qd().book){qd().book=true;S.stats.quests++;gain(10,2)}burst(r.left+r.width/2,r.top+r.height/2,36,9);buzz(25);sfx("pop");floatText(r.left+r.width/2,r.top,"+1 step");save();render();return}
    case "setup":{const tk=S.trackers.find(x=>x.id===v.id);if(tk){tk.spend=Math.max(0,+v.spend||0);tk.perDay=Math.max(0,+v.per||0)}closeSheet();save();render();toast("Saved");return}
    case "med":S.meds.push({id:"m"+Date.now(),name:v.name.trim(),time:v.time,log:{}});ui.addMed=false;save();render();toast("Added as a daily quest");return;
    case "tracker":S.trackers.push({id:"t"+Date.now(),sub:v.sub,goal:v.goal,start:v.start||today(),limit:v.goal==="reduce"?Math.max(0,parseInt(v.limit,10)||0):0,log:{},spend:Math.max(0,+v.spend||0),perDay:Math.max(0,+v.per||0)});ui.addTracker=false;checkMilestones(true);save();render();toast("Tracker added");return;
  }
});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="f-country"){S.clinic.cc=e.target.value;save();render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["today","journey","care","learn","calm","me"].includes(h)&&h!==tab)go(h)});

checkMilestones(true);save();render();dailyOpen();
})();
</script>

</body></html>
