# Netlify configuration for Unhookd (static site, no build step)

[build]
  publish = "."
  command = ""

# Keep project documents (MIT Solve answers, business plan) off the public site.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# The app uses hash routes (#today, #care ...). Unknown paths open the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
